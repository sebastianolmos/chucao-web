name: Chucao CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Chucao
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Check migrations, RLS and account deletion
        env:
          GOOGLE_OAUTH_CLIENT_ID: ci-local-unused
          GOOGLE_OAUTH_CLIENT_SECRET: ci-local-unused
        run: |
          npx --no-install supabase start
          npx --no-install supabase db reset --local --no-seed
          node supabase/tests/run-local.mjs
          node supabase/tests/run-delete-account-local.mjs

  deploy:
    name: Deploy production
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.AUTO_DEPLOY_PRODUCTION == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: chucao-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Build for production
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          : "${VITE_SUPABASE_URL:?Missing production Supabase URL}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?Missing production publishable key}"
          npm run build
          test -s dist/privacy.html
          test -s dist/privacy/en.html
          test -s dist/terms.html
          test -s dist/terms/en.html

      - name: Deploy Supabase migrations and Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          : "${SUPABASE_PROJECT_REF:?Missing production project ref}"
          : "${SUPABASE_ACCESS_TOKEN:?Missing production Supabase access token}"
          : "${SUPABASE_DB_PASSWORD:?Missing production database password}"
          : "${SUPABASE_DB_POOLER_HOST:?Missing production Session pooler hostname}"
          if [[ ! "$SUPABASE_DB_POOLER_HOST" =~ ^[a-z0-9-]+\.pooler\.supabase\.com$ ]]; then
            echo "::error::SUPABASE_DB_POOLER_HOST must be the hostname shown under Session pooler."
            exit 1
          fi

          encoded_password="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          pooler_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@${SUPABASE_DB_POOLER_HOST}:5432/postgres?sslmode=require"
          printf '::add-mask::%s\n' "${encoded_password//%/%25}" "${pooler_url//%/%25}"

          npx --no-install supabase db push --remote="$pooler_url" --yes
          npx --no-install supabase migration list --remote="$pooler_url"
          npx --no-install supabase functions deploy delete-account \
            --remote="$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt --yes

      - name: Publish dist to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          : "${CLOUDFLARE_PAGES_PROJECT:?Missing Pages project}"
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main --commit-hash "$GITHUB_SHA"
